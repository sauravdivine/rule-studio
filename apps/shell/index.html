<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rule Studio</title>
    <!--
      Spec 004: set the theme before the first paint, so a dark-mode user never
      sees a white flash while the JavaScript loads. Must stay inline and
      blocking. Same storage key and logic as libs/ui/src/lib/theme.ts.
    -->
    <script>
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('rs-theme');
          if (stored === 'light' || stored === 'dark') pref = stored;
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
