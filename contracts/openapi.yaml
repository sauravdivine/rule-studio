openapi: 3.1.0
info:
  title: Rule Studio API
  version: 0.1.0
  description: |
    The HTTP contract between the Rule Studio frontend and API.
    Contract-first: this file is written by hand. TypeScript types and Zod
    schemas are generated from it (npm run contracts:types). See specs/002-auth.md.

servers:
  - url: /
    description: Same origin as the frontend (proxied in dev and in deployment)

tags:
  - name: auth
    description: Sign-in, token refresh and sign-out (spec 002)
  - name: rulesets
    description: Rulesets, drafts, published versions and the live version (spec 003)

# Every endpoint needs an access token unless it overrides this with its own `security`.
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      security: [] # open endpoint: no token needed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password. Same response for unknown emails and wrong passwords.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Refresh the session using refresh token as access token is expired
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logs out the user and expires the tokens and removes the cookie
      security:
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: Logout the user.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The signed-in user
      # no `security` here, so the top-level bearerAuth applies
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rulesets:
    get:
      tags: [rulesets]
      operationId: listRulesets
      summary: List rulesets (summaries, no rule content)
      x-permission: ruleset:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
            default: active
        - name: q
          in: query
          description: Case-insensitive text the name must contain.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of rulesets, most recently updated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [rulesets]
      operationId: createRuleset
      summary: Create a ruleset with a starter draft
      x-permission: ruleset:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRulesetRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/rulesets/{id}:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    get:
      tags: [rulesets]
      operationId: getRuleset
      summary: A ruleset with its draft and validation result
      x-permission: ruleset:read
      responses:
        '200':
          description: The ruleset.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [rulesets]
      operationId: updateRuleset
      summary: Change the name or description (not versioned, takes effect at once)
      x-permission: ruleset:edit
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRulesetRequest'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/rulesets/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    put:
      tags: [rulesets]
      operationId: saveDraft
      summary: Replace the draft's content. Cross-field problems are returned, not refused.
      x-permission: ruleset:edit
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesetContent'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/rulesets/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    get:
      tags: [rulesets]
      operationId: listVersions
      summary: Version history, newest first (no content)
      x-permission: ruleset:read
      responses:
        '200':
          description: Every published version.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RulesetVersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [rulesets]
      operationId: publishDraft
      summary: Publish the draft as a new, immutable version
      x-permission: ruleset:publish
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '201':
          description: Published.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/InvalidDraft'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/rulesets/{id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [rulesets]
      operationId: getVersion
      summary: One published version with its frozen content
      x-permission: ruleset:read
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rulesets/{id}/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [rulesets]
      operationId: restoreVersion
      summary: Copy a version's content into the draft (rollback, step 1)
      x-permission: ruleset:edit
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/rulesets/{id}/live:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    put:
      tags: [rulesets]
      operationId: pinLiveVersion
      summary: Make a published version the live one
      x-permission: ruleset:pin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/rulesets/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    post:
      tags: [rulesets]
      operationId: archiveRuleset
      summary: Archive (read-only, hidden from the default list, keeps its live version)
      x-permission: ruleset:archive
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/rulesets/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/RulesetId'
    post:
      tags: [rulesets]
      operationId: unarchiveRuleset
      summary: Make an archived ruleset editable again
      x-permission: ruleset:archive
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/RulesetChanged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Public keys for verifying access tokens
      security: []
      responses:
        '200':
          description: The JSON Web Key Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

components:
  parameters:
    RulesetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read (e.g. `"14"`). Optimistic locking, spec 003.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, valid for 15 minutes, signed with RS256.
    refreshCookie:
      type: apiKey
      in: cookie
      name: rs_refresh
      description: Opaque refresh token, valid for 7 days. HttpOnly, Secure, SameSite=Strict, Path=/api/auth.

  headers:
    ETag:
      description: The ruleset's revision as a strong ETag, e.g. `"14"`. Send it back in If-Match.
      schema:
        type: string
    SetRefreshCookie:
      description: '`rs_refresh=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800`'
      schema:
        type: string
    ClearRefreshCookie:
      description: '`rs_refresh=; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=0`'
      schema:
        type: string

  responses:
    Forbidden:
      description: Signed in, but without the permission this needs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: No such ruleset or version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The change conflicts with the ruleset's state (name taken, nothing to publish, archived, nothing published to pin).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Someone changed the ruleset since you read it. Reload and reapply.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StaleRevisionProblem'
    PreconditionRequired:
      description: Change requests must send If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InvalidDraft:
      description: The draft has cross-field problems, so it can't be published.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidDraftProblem'
    RulesetChanged:
      description: The ruleset after the change.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ruleset'
    BadRequest:
      description: The request body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Not signed in, or the token is missing, expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too many attempts. Try again after the number of seconds in Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200

    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: RS256-signed JWT. Keep in memory only.
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          minimum: 1
        user:
          $ref: '#/components/schemas/User'

    Role:
      type: string
      enum: [VIEWER, EDITOR, ADMIN]

    Permission:
      type: string
      description: What a user may do. The role-to-permission map lives in libs/permissions.
      enum:
        - ruleset:read
        - ruleset:edit
        - ruleset:publish
        - ruleset:pin
        - ruleset:archive
        - simulation:run
        - dashboard:read
        - user:manage

    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Every API error uses this shape.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type, or about:blank.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string

    Jwk:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          const: RSA
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        n:
          type: string
        e:
          type: string

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Jwk'

    # --- Rulesets (spec 003) ---

    # The versioned part of a ruleset (spec 001), defined once in ruleset.schema.json.
    RulesetContent:
      $ref: './ruleset.schema.json#/$defs/RulesetContent'

    UserRef:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    ValidationProblem:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: JSON Pointer into the draft, e.g. `/rules/2/when/children/0/field`.
        message:
          type: string

    RulesetValidation:
      type: object
      additionalProperties: false
      required: [valid, problems]
      properties:
        valid:
          type: boolean
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ValidationProblem'

    RulesetSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          revision,
          hasUnpublishedChanges,
          latestVersion,
          liveVersion,
          archivedAt,
          createdAt,
          createdBy,
          updatedAt,
          updatedBy,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        revision:
          type: integer
          minimum: 1
          description: Bumped by every change. Also sent as the ETag.
        hasUnpublishedChanges:
          type: boolean
          description: The draft differs from the latest published version (true before the first publish).
        latestVersion:
          type: [integer, 'null']
          minimum: 1
        liveVersion:
          type: [integer, 'null']
          minimum: 1
        archivedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UserRef'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/UserRef'

    Ruleset:
      description: A ruleset with its working draft.
      allOf:
        - $ref: '#/components/schemas/RulesetSummary'
        - type: object
          required: [draft, validation]
          properties:
            draft:
              $ref: '#/components/schemas/RulesetContent'
            validation:
              $ref: '#/components/schemas/RulesetValidation'

    RulesetPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulesetSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1

    CreateRulesetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    UpdateRulesetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          description: An empty string clears it.

    PublishRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 500
        makeLive:
          type: boolean
          default: false
          description: >-
            Also make the new version live. Needs `ruleset:pin` (admin), like pinning;
            without it the request gets 403. The first publish is always made live,
            for anyone who may publish.

    PinRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1

    RulesetVersionSummary:
      type: object
      additionalProperties: false
      required:
        [version, comment, contentHash, publishedAt, publishedBy, isLive]
      properties:
        version:
          type: integer
          minimum: 1
        comment:
          type: [string, 'null']
          maxLength: 500
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the RFC 8785 canonical JSON of the content.
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          $ref: '#/components/schemas/UserRef'
        isLive:
          type: boolean

    RulesetVersion:
      description: A published version with its frozen content.
      allOf:
        - $ref: '#/components/schemas/RulesetVersionSummary'
        - type: object
          required: [content]
          properties:
            content:
              $ref: '#/components/schemas/RulesetContent'

    StaleRevisionProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [currentRevision]
          properties:
            currentRevision:
              type: integer
              minimum: 1

    InvalidDraftProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [problems]
          properties:
            problems:
              type: array
              items:
                $ref: '#/components/schemas/ValidationProblem'
